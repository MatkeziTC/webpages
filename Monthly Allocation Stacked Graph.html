            max-width: 1600px;

            text-align: center;

        }
        h1 {
            color: #333;

        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .person-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .person-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #222;
        }
        .chart-container {

            gap: 10px;
            height: 300px;
            align-items: flex-end;
            margin-top: 10px;
            padding: 10px 0;
        }
        .month-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .bar-container {
            width: 100%;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            background: #fafafa;
            position: relative;
        }
        .bar-segment {
            width: 100%;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .bar-segment:hover {
            opacity: 0.85;
        }
        .month-label {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-top: 5px;
        }
        .total-label {
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }
        .legend {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .overallocated {
            border: 2px solid #ff4444 !important;
        }
        .allocation-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        .badge-over {
            background: #ff4444;
            color: white;
        }
        .badge-full {
            background: #44aa44;
            color: white;
        }
        .badge-under {
            background: #ffaa44;
            color: white;
        }
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            white-space: nowrap;
            z-index: 1000;
            display: none;
        }
    </style>

        function CapacityChart() {
            const [selectedPerson, setSelectedPerson] = useState(null);
            const [hoveredSegment, setHoveredSegment] = useState(null);
            const [tooltipPos, setTooltipPos] = useState({ x: 0, y: 0 });

            const months = ['Sept', 'Oct', 'Nov', 'Dec'];

            const handleSegmentHover = (e, person, month, project) => {
                setHoveredSegment({ person, month, project });
                setTooltipPos({ x: e.clientX, y: e.clientY });
            };

            const handleSegmentLeave = () => {
                setHoveredSegment(null);
            };

            const getAllocationBadge = (total) => {
                if (total > 100) {
                    return <span className="allocation-badge badge-over">Over {Math.round(total)}%</span>;
                } else if (total === 100) {
                    return <span className="allocation-badge badge-full">100%</span>;
                } else if (total > 0) {
                    return <span className="allocation-badge badge-under">{Math.round(total)}%</span>;
                }
                return null;
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>Team Capacity Allocation</h1>
                        <p style={{color: '#666'}}>September - December 2025</p>
                    </div>

                    <div className="grid">
                        {Object.entries(CAPACITY_DATA).map(([person, data]) => {
                            const allProjects = new Set();
                            months.forEach(month => {
                                data.projects[month].forEach(p => allProjects.add(p.project));
                            });

                            return (
                                <div key={person} className="person-card">
                                    <div className="person-name">
                                        {person}
                                        {months.map(month => {
                                            const total = data.totals[month];
                                            if (total > 100) {
                                                return getAllocationBadge(total);
                                            }
                                            return null;
                                        })[0]}
                                    </div>

                                    <div className="chart-container">
                                        {months.map(month => {
                                            const monthData = data.projects[month];
                                            const total = data.totals[month];
                                            
                                            return (
                                                <div key={month} className="month-column">
                                                    <div className="total-label">{Math.round(total)}%</div>
                                                    <div className={`bar-container ${total > 100 ? 'overallocated' : ''}`}>
                                                        {monthData.map((segment, idx) => {
                                                            const height = (segment.value / 100) * 250;
                                                            const color = PROJECT_COLORS[segment.project] || '#999';
                                                            
                                                            return (
                                                                <div
                                                                    key={idx}
                                                                    className="bar-segment"
                                                                    style={{
                                                                        height: `${height}px`,
                                                                        backgroundColor: color,
                                                                        minHeight: segment.value < 5 ? '12px' : '0'
                                                                    }}
                                                                    onMouseEnter={(e) => handleSegmentHover(e, person, month, segment)}
                                                                    onMouseLeave={handleSegmentLeave}
                                                                >
                                                                    {segment.value >= 15 && `${Math.round(segment.value)}%`}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                    <div className="month-label">{month}</div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="legend">
                                        {Array.from(allProjects).map(project => (
                                            <div key={project} className="legend-item">
                                                <div 
                                                    className="legend-color" 
                                                    style={{backgroundColor: PROJECT_COLORS[project] || '#999'}}
                                                />
                                                <span>{project}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {hoveredSegment && (
                        <div 
                            className="tooltip" 
                            style={{
                                display: 'block',
                                left: `${tooltipPos.x + 10}px`,
                                top: `${tooltipPos.y - 30}px`
                            }}
                        >
                            {hoveredSegment.project.project}: {hoveredSegment.project.function} ({Math.round(hoveredSegment.project.value)}%)
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<CapacityChart />, document.getElementById('root'));
    </script>
</body>
</html>
